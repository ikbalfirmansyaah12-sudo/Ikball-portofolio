name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify portfolio files
        run: |
          test -f ocean-portfolio/index.html
          test -f ocean-portfolio/assets/profile.png
          test -f ocean-portfolio/assets/half-marathon-finish.jpg
          test -f ocean-portfolio/assets/entertainment-modeling.png
          test -f ocean-portfolio/assets/casting-modeling.jpg
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ocean-portfolio
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
